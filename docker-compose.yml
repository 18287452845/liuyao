version: '3.8'

services:
  # MySQL数据库服务
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: divination_db
      MYSQL_USER: divination_user
      MYSQL_PASSWORD: divination_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  # Next.js应用服务
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://divination_user:divination_password@db:3306/divination_db?connection_limit=10&pool_timeout=20&connect_timeout=10
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - DEEPSEEK_API_KEY=your-deepseek-api-key
    depends_on:
      - db
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data: